<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <meta name="author" content="Guilherme Schuch">

    <link rel="stylesheet" href="./css/styles.css">
  </head>

  <body>
    <div class="importSongsContainer">
      <label for="fileInput" class="selectSongsBtn" data-i18n="selectSongs">Selecionar Músicas</label>

      <input
        type="file"
        name="fileInput"
        id="fileInput"
        multiple
        accept=".mp3"
        style="display: none;"
      >
    </div>

    <ul id="audioList"></ul>
    <ul id="playlist"></ul>

    <progress id="progressBar" value="0" max="100"></progress>

    <div class="controls">
      <div class="buttons">
        <button
          id="backwardBtn"
          class="controlBtn clearBtn"
          disabled
        >
          <img src="./assets/back.ico" alt="BACK" width="20">
        </button>

        <button
          id="prevSongBtn"
          class="controlBtn clearBtn"
          disabled
        >
          <img src="./assets/previous.ico" alt="PREV" width="20">
        </button>

        <button
          id="togglePauseBtn"
          class="controlBtn clearBtn"
          disabled
          style="display: none;"
        >
          <img src="./assets/pause.ico" alt="PAUSE" width="20">
        </button>

        <button
          id="playSongs"
          class="controlBtn clearBtn"
          disabled
        >
          <img src="./assets/play.ico" alt="PLAY" width="20">
        </button>

        <button
          id="nextSongBtn"
          class="controlBtn clearBtn"
          disabled
        >
          <img src="./assets/next.ico" alt="NEXT" width="20">
        </button>

        <button
          id="toggleSettingsbtn"
          class="controlBtn clearBtn"
        >
          <img src="./assets/settings.ico" alt="CONFIG" width="20">
        </button>
      </div>

      <input type="range" name="volume" id="volume" max="1" min="0" step="0.01">

      <div class="gainControl">
        <label for="songGain" data-i18n="songGain">Ganho da música</label>
        <input type="range" name="songGain" id="songGain" min="-12" max="12" step="0.5" value="0" disabled>
        <span id="songGainValue">0 dB</span>
      </div>
    </div>

    <div class="about">
      <p>V2.8</p>
      <p><span data-i18n="by">By</span>: Guilherme Schuch</p>
    </div>

  </body>

  <script src="./js/renderer.js"></script>
</html>
